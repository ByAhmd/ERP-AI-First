; Application PHP settings. Kept separate from the base image defaults so that
; upgrading the PHP image never silently drops these.

memory_limit = 512M
max_execution_time = 120

; Financial documents and ZATCA payloads can be sizeable.
upload_max_filesize = 32M
post_max_size = 32M

; Saudi Arabia. Application-level dates are stored UTC; this only affects
; PHP's own date functions when no timezone is passed explicitly.
date.timezone = UTC

; Fail loudly in development. The production image overrides this.
display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
