services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Horizon is the reason the app runs in Linux containers: it requires
  # ext-pcntl, which Windows cannot provide in any PHP build.
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: erp-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-flush-log-at-trx-commit=1
      # READ-COMMITTED avoids the gap locks REPEATABLE-READ takes on
      # SELECT ... FOR UPDATE, which the gapless document sequence relies on.
      - --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_DATABASE: erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp_local_password
      MYSQL_ROOT_PASSWORD: erp_local_root_password
    ports:
      # 3307 on the host: 3306 belongs to another project on this machine.
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uerp', '-perp_local_password']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # 6380 on the host: 6379 belongs to another project on this machine.
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
